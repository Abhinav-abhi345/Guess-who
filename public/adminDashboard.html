<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Person - Guess Who</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
    
      body {
        margin: 0;
        min-height: 100vh;
        background: #f4f6f9;
        display: flex;
        flex-direction: column;
        align-items: center;
        color: #18304b;
      }
    
      h1 {
        width: 100%;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 2.5rem;
        font-weight: bold;
        color: #fff;
        background: #2c3e50;
      }
    
      .main {
        margin: 0;
        width: 90%;
        max-width: 700px;
        background: #fff;
        border: 1px solid #e1e8ef;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 12px 40px #18304b0a;
      }

      .form-region {
        width: 100%;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 0 88px;
      }
    
      form {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
    
      form div {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
    
      label {
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
    
      input[type="text"],
      input[type="file"] {
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid #cad9e9;
        background: #f8fafd;
        color: #18304b;
        outline: none;
        font-size: 1rem;
      }
    
      input[type="text"]::placeholder {
        color: #777;
      }
    
      input[type="text"]:focus,
      input[type="file"]:focus {
        outline: 2px solid #4fc3f7;
      }

      select {
      font-size: 1rem;
      outline: none;
      }

      select:focus {
      outline: 2px solid #4fc3f7;
      }
    
      #submit {
        margin-top: 35px;
        width: 100%;
        padding: 14px;
        font-size: 1.2rem;
        font-weight: bold;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        background: #1769ce;
        color: #fff;
        transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      }
    
      #submit:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 16px #1769ce26;
        opacity: 0.95;
      }
    
      #submit:active {
        transform: translateY(0);
        box-shadow: none;
      }
    
      @media (max-width: 600px) {
        .main {
          padding: 25px;
        }
      }
      @media (max-width: 500px) {
        h1 {
          font-size: 2rem;
        }
      }
    </style>
    <link rel="stylesheet" href="ui.css">
</head>
<body>
    <nav class="admin-back-nav" aria-label="Admin navigation"><a href="admin.html"><span aria-hidden="true">&larr;</span>&nbsp; Admin Home</a></nav>
    <h1>Add Person</h1>
    <main class="form-region">
    <div class="main">
        <form class="area" id="upload" novalidate>
        <div>
            <label for="file">Image:-</label>
            <input type="file"  style="height: 50px;" id="file" name="file" accept=".jpeg, .jpg, .png" multiple >
        </div>
        <div>
            <label for="name" >Name:-</label>
            <input type="text" placeholder="Enter your name here" style="height: 40px;" id="name" name="name" maxlength="120">
        </div>
        <div>
      <label for="gender">Gender:-</label>
      <select id="gender" name="gender" style="height: 40px; border-radius: 8px; border: none; padding: 8px;">
          <option value="">-- Select Gender --</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
      </select>
</div>

        <button  id="submit" type="submit">Submit</button>
        </form>
        <p id="saveStatus" role="status" aria-live="polite"></p>
    </div>
    </main>
    <script src="admin.js" type="module"></script>
</body>
</html>
