<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/png" href="./next_9653622.png">
    <style>
        .title {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin-top: 15%;
            row-gap: 5px;
        }
        .outer-box{
            display: flex;
            justify-content: center;
            width: 200px;
            border: 1px solid rgb(187, 182, 182);
            border-radius: 4px;
            padding: 20px;
            background-color: rgb(242, 245, 245);
            
        }
        form {
            position: relative;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;

        }
        form label {
            font-size: 13px;
            font-family: Arial, Helvetica, sans-serif;
            margin-bottom: 5px;
            
        }
        form input{
            width: 200px;
        }
        #login {
            width: 208px;
            background-color: rgb(33, 218, 153);
            border: none;
            border-radius: 3px;
            color: white;
            padding: 4px;
            margin-top: 10px;
        }
        #login:hover{
            transform: scale(102%);
        }
        #loginStatus {
            margin: 10px 0 0;
            max-width: 208px;
            font: 13px/1.4 Arial, Helvetica, sans-serif;
            color: #a12c2c;
        }
        #loginStatus:empty {
            display: none;
        }
        img:hover {
            transform: scale(105%);
            transition: transform 3s ease;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="title">
            <img src="./next_9653622.png" alt="git logo" height="80px">
            <div class="outer-box">
                <form onsubmit="event.preventDefault(); validate()" novalidate>
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required maxlength="120">
                    <!-- <a href="homePage.html"><input type="button" id="login" value="Login"></a> -->
                     <input type="submit" id="login" value="Login">
                     <p id="loginStatus" role="alert"></p>
                </form>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      function validate() {
        const username = document.getElementById("username").value.trim();

        if (!username || username.length > 120) {
          document.getElementById('loginStatus').textContent = 'Please enter a username between 1 and 120 characters.';
          return;
        }

        try { sessionStorage.setItem("username", username); }
        catch { document.getElementById('loginStatus').textContent = 'Browser storage is unavailable. Enable session storage to join.'; return; }

        window.location.href = "/guessWho.html";
    }
</script>

</body>
</html>
